services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point the backend at the sibling services above instead of the
      # zero-config embedded/in-memory defaults (see vectorstore.py and
      # cache.py for why that matters once WEB_CONCURRENCY > 1).
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./database:/app/database

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend