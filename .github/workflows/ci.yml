name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          # The existing test suite doesn't call any provider, but
          # Settings() reads these at import time -- keep them defined
          # (even if empty) so CI doesn't depend on real secrets.
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          HUGGINGFACE_API_KEY: ""
        run: pytest tests -q